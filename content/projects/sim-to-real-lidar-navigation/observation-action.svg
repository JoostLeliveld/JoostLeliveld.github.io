<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Origin One LiDAR navigation observation and action design</title>
  <desc id="desc">A compact reinforcement-learning interface diagram showing LiDAR and goal observations entering a PPO policy, producing differential-drive commands and receiving reward terms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5f6"/>
      <stop offset="0.5" stop-color="#f7f1e3"/>
      <stop offset="1" stop-color="#eef4ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1c302f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#386b6a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="74" fill="#1f3432" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Origin One LiDAR Navigation Interface</text>
  <text x="72" y="112" fill="#5a6967" font-family="Inter, Arial, sans-serif" font-size="20">Public-facing summary of the RL inputs, policy output, and reward design for sim-to-real navigation.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="72" y="176" width="292" height="330" rx="24" fill="#ffffff" stroke="#b8d3d1"/>
    <text x="218" y="218" text-anchor="middle" fill="#1f3432" font-size="24" font-weight="700">Observation</text>
    <circle cx="218" cy="348" r="70" fill="#eef7f6" stroke="#74aaa5" stroke-width="5"/>
    <circle cx="218" cy="348" r="13" fill="#243b3a"/>
    <g stroke="#74aaa5" stroke-width="3" opacity="0.9">
      <line x1="218" y1="348" x2="129" y2="311"/>
      <line x1="218" y1="348" x2="148" y2="262"/>
      <line x1="218" y1="348" x2="218" y2="236"/>
      <line x1="218" y1="348" x2="288" y2="262"/>
      <line x1="218" y1="348" x2="307" y2="311"/>
      <line x1="218" y1="348" x2="315" y2="386"/>
      <line x1="218" y1="348" x2="260" y2="450"/>
      <line x1="218" y1="348" x2="176" y2="450"/>
      <line x1="218" y1="348" x2="121" y2="386"/>
    </g>
    <text x="218" y="458" text-anchor="middle" fill="#5a6967" font-size="16">LiDAR ranges plus goal-relative state</text>

    <rect x="454" y="208" width="292" height="266" rx="24" fill="#1f3432" stroke="#5f8c86"/>
    <text x="600" y="260" text-anchor="middle" fill="#f7f1e3" font-size="24" font-weight="700">PPO Policy</text>
    <text x="600" y="312" text-anchor="middle" fill="#d7e8e3" font-size="17">learned navigation behavior</text>
    <rect x="500" y="354" width="200" height="62" rx="14" fill="#f7f1e3" opacity="0.95"/>
    <text x="600" y="392" text-anchor="middle" fill="#1f3432" font-size="18" font-weight="700">training in Isaac Lab</text>

    <rect x="836" y="176" width="292" height="330" rx="24" fill="#ffffff" stroke="#d8bf84"/>
    <text x="982" y="218" text-anchor="middle" fill="#4e3f1b" font-size="24" font-weight="700">Action</text>
    <rect x="914" y="274" width="136" height="76" rx="18" fill="#edf5f6" stroke="#74aaa5"/>
    <circle cx="932" cy="362" r="20" fill="#293b3a"/>
    <circle cx="1032" cy="362" r="20" fill="#293b3a"/>
    <rect x="944" y="308" width="56" height="34" rx="8" fill="#74aaa5"/>
    <path d="M910 410 C948 384 1010 384 1052 410" fill="none" stroke="#c76f4a" stroke-width="4"/>
    <text x="982" y="458" text-anchor="middle" fill="#5a6967" font-size="16">differential-drive velocity command</text>
  </g>

  <g fill="none" stroke="#386b6a" stroke-width="5" marker-end="url(#arrow)">
    <path d="M364 340 H440"/>
    <path d="M746 340 H822"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="214" y="555" width="772" height="64" rx="24" fill="#ffffff" stroke="#cfd8d3"/>
    <text x="254" y="595" fill="#1f3432" font-size="18" font-weight="700">Reward design:</text>
    <text x="390" y="595" fill="#5a6967" font-size="17">goal progress, collision avoidance, control smoothness, and task completion.</text>
  </g>
</svg>
