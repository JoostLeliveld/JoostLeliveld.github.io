<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SystemVerilog CNN accelerator datapath</title>
  <desc id="desc">A hardware block diagram for a CNN accelerator with input buffers, weight memory, MAC array, accumulator, activation, output buffer, and verification signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="0.48" stop-color="#f6f2e6"/>
      <stop offset="1" stop-color="#edf7ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#18293a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#395c76"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="74" fill="#1d2d3c" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">CNN Accelerator in SystemVerilog</text>
  <text x="72" y="112" fill="#58636b" font-family="Inter, Arial, sans-serif" font-size="20">Weight reuse, memory movement, simulation, and datapath verification.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="72" y="176" width="164" height="94" rx="14" fill="#ffffff" stroke="#bfd0dd"/>
    <text x="154" y="214" text-anchor="middle" fill="#1d2d3c" font-size="18" font-weight="700">Input Buffer</text>
    <text x="154" y="242" text-anchor="middle" fill="#66737d" font-size="14">feature tiles</text>

    <rect x="288" y="176" width="164" height="94" rx="14" fill="#ffffff" stroke="#bfd0dd"/>
    <text x="370" y="214" text-anchor="middle" fill="#1d2d3c" font-size="18" font-weight="700">Line Buffer</text>
    <text x="370" y="242" text-anchor="middle" fill="#66737d" font-size="14">sliding window</text>

    <rect x="504" y="176" width="164" height="94" rx="14" fill="#ffffff" stroke="#bfd0dd"/>
    <text x="586" y="214" text-anchor="middle" fill="#1d2d3c" font-size="18" font-weight="700">Weight SRAM</text>
    <text x="586" y="242" text-anchor="middle" fill="#66737d" font-size="14">reuse schedule</text>

    <rect x="720" y="160" width="210" height="126" rx="18" fill="#1f3a4d" stroke="#5f849b"/>
    <text x="825" y="196" text-anchor="middle" fill="#f8f6ed" font-size="19" font-weight="700">MAC Array</text>
    <g fill="#f8f6ed" opacity="0.9">
      <rect x="760" y="218" width="28" height="28" rx="5"/>
      <rect x="802" y="218" width="28" height="28" rx="5"/>
      <rect x="844" y="218" width="28" height="28" rx="5"/>
      <rect x="760" y="252" width="28" height="18" rx="5"/>
      <rect x="802" y="252" width="28" height="18" rx="5"/>
      <rect x="844" y="252" width="28" height="18" rx="5"/>
    </g>

    <rect x="982" y="176" width="146" height="94" rx="14" fill="#ffffff" stroke="#bfd0dd"/>
    <text x="1055" y="214" text-anchor="middle" fill="#1d2d3c" font-size="18" font-weight="700">Output</text>
    <text x="1055" y="242" text-anchor="middle" fill="#66737d" font-size="14">activation map</text>
  </g>

  <g fill="none" stroke="#395c76" stroke-width="4" marker-end="url(#arrow)">
    <path d="M236 223 H278"/>
    <path d="M452 223 H494"/>
    <path d="M668 223 H710"/>
    <path d="M930 223 H972"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="116" y="358" width="428" height="164" rx="20" fill="#ffffff" stroke="#d8c28b"/>
    <text x="146" y="394" fill="#604c1f" font-size="21" font-weight="700">Dataflow focus</text>
    <text x="146" y="432" fill="#665e4c" font-size="16">1. Keep weights local across multiple windows</text>
    <text x="146" y="464" fill="#665e4c" font-size="16">2. Stream feature tiles through a small buffer</text>
    <text x="146" y="496" fill="#665e4c" font-size="16">3. Accumulate partial sums before writeback</text>

    <rect x="656" y="358" width="428" height="164" rx="20" fill="#ffffff" stroke="#9fbca7"/>
    <text x="686" y="394" fill="#29452e" font-size="21" font-weight="700">Verification focus</text>
    <path d="M692 468 H1042" stroke="#cbd9cf" stroke-width="2"/>
    <path d="M704 430 v38 h36 v-38 h38 v38 h36 v-38 h38 v38 h36 v-38 h38 v38 h36" fill="none" stroke="#3f7a55" stroke-width="4"/>
    <path d="M704 492 h52 l18 -38 h54 l18 38 h56 l18 -38 h54 l18 38 h50" fill="none" stroke="#c76f4a" stroke-width="4"/>
    <text x="686" y="430" fill="#665e4c" font-size="16">clock, valid, expected outputs</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="276" y="574" width="648" height="44" rx="22" fill="#1d2d3c" opacity="0.92"/>
    <text x="600" y="603" text-anchor="middle" fill="#f8f6ed" font-size="18">Case-study angle: hardware-aware neural-network execution, not just Python model training.</text>
  </g>
</svg>
