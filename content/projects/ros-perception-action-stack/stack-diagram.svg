<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ROS perception-to-action stack diagram</title>
  <desc id="desc">A camera-to-motor robotics software pipeline with ROS nodes, topics, and encoder feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f3"/>
      <stop offset="0.55" stop-color="#f7f1df"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#15312c" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6258"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.45">
    <path d="M80 125 C220 60 340 118 474 78 C650 25 760 88 906 58 C1035 32 1105 65 1160 108" fill="none" stroke="#98b5ac" stroke-width="2"/>
    <path d="M62 570 C204 495 315 545 458 500 C645 438 758 518 900 470 C1025 428 1108 464 1165 508" fill="none" stroke="#caa46a" stroke-width="2"/>
  </g>
  <text x="70" y="74" fill="#14342f" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">ROS Perception-to-Action Robot Stack</text>
  <text x="72" y="112" fill="#576963" font-family="Inter, Arial, sans-serif" font-size="20">Camera observations become robot behavior through nodes, topics, control, and feedback.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="66" y="178" width="168" height="104" rx="16" fill="#ffffff" stroke="#b8d1c8"/>
    <text x="150" y="218" text-anchor="middle" fill="#173b35" font-size="20" font-weight="700">Camera</text>
    <text x="150" y="250" text-anchor="middle" fill="#64756f" font-size="15">image frames</text>

    <rect x="286" y="178" width="168" height="104" rx="16" fill="#ffffff" stroke="#b8d1c8"/>
    <text x="370" y="210" text-anchor="middle" fill="#173b35" font-size="19" font-weight="700">Calibration</text>
    <text x="370" y="240" text-anchor="middle" fill="#64756f" font-size="15">undistort</text>
    <text x="370" y="262" text-anchor="middle" fill="#64756f" font-size="15">preprocess</text>

    <rect x="506" y="178" width="168" height="104" rx="16" fill="#ffffff" stroke="#b8d1c8"/>
    <text x="590" y="210" text-anchor="middle" fill="#173b35" font-size="19" font-weight="700">Perception</text>
    <text x="590" y="240" text-anchor="middle" fill="#64756f" font-size="15">detect</text>
    <text x="590" y="262" text-anchor="middle" fill="#64756f" font-size="15">track target</text>

    <rect x="726" y="178" width="168" height="104" rx="16" fill="#ffffff" stroke="#b8d1c8"/>
    <text x="810" y="210" text-anchor="middle" fill="#173b35" font-size="19" font-weight="700">Behavior</text>
    <text x="810" y="240" text-anchor="middle" fill="#64756f" font-size="15">state machine</text>
    <text x="810" y="262" text-anchor="middle" fill="#64756f" font-size="15">decision logic</text>

    <rect x="946" y="178" width="168" height="104" rx="16" fill="#ffffff" stroke="#b8d1c8"/>
    <text x="1030" y="210" text-anchor="middle" fill="#173b35" font-size="19" font-weight="700">Actuation</text>
    <text x="1030" y="240" text-anchor="middle" fill="#64756f" font-size="15">motor command</text>
    <text x="1030" y="262" text-anchor="middle" fill="#64756f" font-size="15">drive output</text>
  </g>

  <g fill="none" stroke="#2f6258" stroke-width="4" marker-end="url(#arrow)">
    <path d="M234 230 H276"/>
    <path d="M454 230 H496"/>
    <path d="M674 230 H716"/>
    <path d="M894 230 H936"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="184" y="334" width="832" height="130" rx="22" fill="#173b35" opacity="0.92"/>
    <text x="220" y="380" fill="#f7f1df" font-size="22" font-weight="700">ROS integration layer</text>
    <text x="220" y="418" fill="#d7e7e0" font-size="17">/camera/image_raw</text>
    <text x="416" y="418" fill="#d7e7e0" font-size="17">/target_estimate</text>
    <text x="640" y="418" fill="#d7e7e0" font-size="17">/cmd_vel</text>
    <text x="806" y="418" fill="#d7e7e0" font-size="17">/encoder_ticks</text>
    <path d="M215 436 H980" stroke="#88b8a8" stroke-width="2" stroke-dasharray="10 12"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="335" y="522" width="220" height="74" rx="14" fill="#fffaf0" stroke="#d3b36c"/>
    <text x="445" y="552" text-anchor="middle" fill="#614719" font-size="18" font-weight="700">Closed loop</text>
    <text x="445" y="578" text-anchor="middle" fill="#75633b" font-size="14">encoder feedback validates motion</text>

    <rect x="645" y="522" width="220" height="74" rx="14" fill="#eff6ff" stroke="#9fb7df"/>
    <text x="755" y="552" text-anchor="middle" fill="#223d69" font-size="18" font-weight="700">Robot-facing behavior</text>
    <text x="755" y="578" text-anchor="middle" fill="#556b8e" font-size="14">software modules drive hardware</text>
  </g>
  <path d="M1030 282 C1070 390 1000 560 872 560" fill="none" stroke="#bd8e39" stroke-width="4" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <path d="M336 560 C210 560 148 440 150 292" fill="none" stroke="#bd8e39" stroke-width="4" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
</svg>
