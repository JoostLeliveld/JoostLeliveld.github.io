<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Unbalanced disk learning-based control summary</title>
  <desc id="desc">A nonlinear dynamics and control figure showing an unbalanced disk, GP model learning, and actor-critic controller comparisons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ef"/>
      <stop offset="0.52" stop-color="#edf4f7"/>
      <stop offset="1" stop-color="#f9efe3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2c3026" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d6f61"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="74" fill="#223329" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Learning Nonlinear Dynamics and Control</text>
  <text x="72" y="112" fill="#5b665e" font-family="Inter, Arial, sans-serif" font-size="20">Unbalanced disk experiments across model learning, uncertainty, and actor-critic policies.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="166" width="302" height="380" rx="24" fill="#ffffff" stroke="#d7dfd4"/>
    <circle cx="221" cy="334" r="105" fill="#eef5f0" stroke="#63836f" stroke-width="6"/>
    <circle cx="221" cy="334" r="10" fill="#20362c"/>
    <line x1="221" y1="334" x2="286" y2="253" stroke="#20362c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="286" cy="253" r="24" fill="#c76f4a"/>
    <path d="M151 443 C185 466 259 472 303 438" fill="none" stroke="#d3a143" stroke-width="5" stroke-linecap="round"/>
    <text x="221" y="202" text-anchor="middle" fill="#223329" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">System</text>
    <text x="221" y="508" text-anchor="middle" fill="#5b665e" font-family="Inter, Arial, sans-serif" font-size="16">nonlinear state, torque input, unstable motion</text>
  </g>

  <g fill="none" stroke="#4d6f61" stroke-width="5" marker-end="url(#arrow)">
    <path d="M386 336 H466"/>
    <path d="M738 336 H818"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="466" y="166" width="272" height="380" rx="24" fill="#ffffff" stroke="#d7dfd4"/>
    <text x="602" y="202" text-anchor="middle" fill="#223329" font-size="22" font-weight="700">Dynamics Models</text>
    <rect x="506" y="242" width="192" height="66" rx="12" fill="#edf7f4" stroke="#9ac0b3"/>
    <text x="602" y="282" text-anchor="middle" fill="#294d44" font-size="18" font-weight="700">Gaussian Process</text>
    <rect x="506" y="334" width="192" height="66" rx="12" fill="#f7f1df" stroke="#d6b76f"/>
    <text x="602" y="374" text-anchor="middle" fill="#654f1e" font-size="18" font-weight="700">Sparse GP</text>
    <path d="M514 472 C550 416 590 486 626 435 C651 400 672 438 697 410" fill="none" stroke="#426f79" stroke-width="4"/>
    <path d="M514 493 C550 460 590 510 626 464 C651 435 672 462 697 446" fill="none" stroke="#c76f4a" stroke-width="4" stroke-dasharray="8 8"/>
    <text x="602" y="520" text-anchor="middle" fill="#5b665e" font-size="15">rollout fit and uncertainty</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="818" y="166" width="312" height="380" rx="24" fill="#ffffff" stroke="#d7dfd4"/>
    <text x="974" y="202" text-anchor="middle" fill="#223329" font-size="22" font-weight="700">Controller Benchmarks</text>
    <rect x="860" y="242" width="228" height="190" rx="14" fill="#f8faf8" stroke="#d7dfd4"/>
    <path d="M886 390 H1064" stroke="#bbc7c0" stroke-width="2"/>
    <path d="M886 280 V390" stroke="#bbc7c0" stroke-width="2"/>
    <path d="M892 374 C932 340 950 325 982 300 C1016 272 1038 276 1060 252" fill="none" stroke="#4d8a68" stroke-width="4"/>
    <path d="M892 383 C926 370 948 348 978 342 C1018 334 1039 318 1060 296" fill="none" stroke="#d3a143" stroke-width="4"/>
    <path d="M892 382 C930 378 956 372 984 360 C1018 346 1042 354 1060 336" fill="none" stroke="#c76f4a" stroke-width="4"/>
    <text x="976" y="456" text-anchor="middle" fill="#5b665e" font-size="15">reward and stability comparisons</text>
    <text x="884" y="494" fill="#4d8a68" font-size="16" font-weight="700">SAC</text>
    <text x="956" y="494" fill="#d3a143" font-size="16" font-weight="700">PPO</text>
    <text x="1032" y="494" fill="#c76f4a" font-size="16" font-weight="700">DDPG</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="136" y="590" width="928" height="44" rx="22" fill="#223329" opacity="0.92"/>
    <text x="600" y="619" text-anchor="middle" fill="#f7f1df" font-size="18">Portfolio focus: compare model-based and model-free learning choices without exposing private coursework code.</text>
  </g>
</svg>
