bio: |
  I work on robotics systems that connect perception, simulation, planning, and control.
  I graduated cum laude from the MSc AI & Engineering Systems at Eindhoven University of Technology, with a thesis on camera-network modelling for belief-space robot navigation, and presented the resulting work at IWAI 2026.
  I am looking for roles in robot learning, perception, and embodied AI (industry or PhD) in Eindhoven, Utrecht, or Zurich.
  I like projects where the interesting part is the whole loop: sensing, uncertainty, decisions, and what finally happens in the robot or simulator.

