experience:
  - role: MSc Thesis Researcher - Robotics & Computer Vision
    organization: Eindhoven University of Technology (BIASlab)
    logo: "/uploads/experience/tue.png"
    start: 2026-02-01
    end: 2026-10-31
    summary: |
      Built a ROS 2/Gazebo navigation stack in which fixed cameras detect a TurtleBot3 with YOLO and calibrated image-to-ground-plane estimates update the robot's belief.
      A spatial Gaussian Process models where the cameras are reliable and scales the observation covariance in an Expected Free Energy planner. First-author paper presented (oral) at IWAI 2026.
    tags:
      - ROS 2
      - Gazebo
      - Computer Vision
      - Gaussian Processes

  - role: AI Intern - Reinforcement Learning in Robotics
    organization: Avular
    logo: "/uploads/experience/avular-logo.webp"
    start: 2025-02-01
    end: 2025-06-30
    summary: |
      Worked in a four-person team on obstacle-avoidance policies for the Origin One robot, using NVIDIA Isaac Lab, PyTorch, AWS EC2 GPU instances, and experiment tracking.
      The internship focused on the practical gap between simulation-trained reinforcement learning policies and mobile-robot behavior.
    tags:
      - Reinforcement Learning
      - Isaac Lab
      - PyTorch
      - AWS

