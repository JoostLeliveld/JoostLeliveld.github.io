bio: |
  I am an MSc AI & Engineering Systems student at Eindhoven University of Technology, focused on the High Tech Systems and Robotics track.
  My work sits at the intersection of robotics, computer vision, sensor fusion, and learning-based control, with a current graduation project on mobile robot navigation from external camera observations.
  I enjoy building reproducible experimental pipelines that connect simulation, perception, planning, and real robot behavior.

